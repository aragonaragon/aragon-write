<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 420px;
      height: 280px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #121216;
      border-radius: 22px;
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 40px;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(360px 200px at 88% -10%, rgba(212, 174, 92, 0.16), transparent 65%);
      pointer-events: none;
    }

    .mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      font-family: "Amiri", "Traditional Arabic", Georgia, serif;
      font-weight: 700;
      font-size: 40px;
      line-height: 1;
      padding-top: 4px;
      color: #1a1508;
      background: linear-gradient(160deg, #ecd28a 0%, #d4ae5c 55%, #9d7c36 130%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25),
        0 12px 30px rgba(212, 174, 92, 0.25);
      animation: float 3.2s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }

    .title {
      position: relative;
      font-family: "Amiri", "Traditional Arabic", Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      color: #ece7dc;
      letter-spacing: -0.01em;
      padding-top: 4px;
    }

    .line {
      position: relative;
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4ae5c, transparent);
    }

    .subtitle {
      position: relative;
      font-size: 12px;
      color: #6d6961;
      letter-spacing: 0.08em;
    }

    .loader {
      position: relative;
      display: flex;
      gap: 7px;
      margin-top: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d4ae5c;
      animation: bounce 1.4s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0) scale(0.7); opacity: 0.35; }
      40% { transform: translateY(-6px) scale(1); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">أ</div>
    <div class="title">أرغون رايت</div>
    <div class="line"></div>
    <div class="subtitle">جاري تشغيل المحرر...</div>
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
